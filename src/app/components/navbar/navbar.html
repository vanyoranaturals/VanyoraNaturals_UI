<!-- Top Announcement Banner -->
<div class="banner text-center">
  <div class="container">
    <p class="mb-0 banner-text">
      🌿 <strong>Vanyora Naturals</strong> &mdash; Nature in Every Nourishment
    </p>
  </div>
</div>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg custom-navbar sticky-top">
  <div class="container">

    <!-- Logo Div -->
    <div class="log">
      <a class="navbar-brand d-flex flex-column" routerLink="/home" (click)="closeMenu()">
        <span class="brand-main">Vanyora</span>
        <span class="brand-sub">Naturals</span>
      </a>
    </div>

    <!-- Mobile Toggler -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="vanyoraNavMenu"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav Menu Div -->
    <div
      class="nav-menu collapse navbar-collapse justify-content-end"
      id="vanyoraNavMenu"
      [class.show]="isMenuOpen"
    >
      <ul class="navbar-nav align-items-lg-center gap-lg-3">
        @for (item of navItems; track item.path) {
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.path === '/home' }"
              (click)="closeMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>

  </div>
</nav>
